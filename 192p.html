            <main class="texte-projet">
                <p>
                    Un objet hybride : <br>
                    192 pages, pressées en seulement 4 exemplaires, à la fois livre et disque, on le lit autant qu'on l'écoute.<br>
                    <br>
                    Il relie le projet Made et un projet de cours :<br>
                    Il fallait répondre à la question : <br>
                    <br>
                    <strong>"C'est quoi une mixtape ?"</strong><br>
                    <br>
                    Alors j'ai ramené toute la matière déjà écouté dans les vinyles et j'en ai fais une mixtape. <br>
                    <br>
                    Ma mixtape : ma voix, des mots, des sons de nature (soundscapes), des enregistrements bruts, des collages, et une composition personnelle.<br>
                    <br>
                    Tout ça forme MA mixtape.<br>
                    <br>
                    À l'origine, une mixtape, c'est gratuit. <br>
                    C'est un geste : du partage, sans logique commerciale.<br>
                    <br>
                    Mais le mot a été récupéré et industrialisé aujourd'hui, il sert surtout à faire du marketing.<br>
                    <br>
                    Ce projet, je l'ai fait jusqu'au bout, jusqu'à presser <br>
                    4 vinyles chez <a href="https://www.vinyl-pressing.com" class="lien-projet"><strong> Heavy Grooves Records.</strong></a>
                </p>
            </main>
