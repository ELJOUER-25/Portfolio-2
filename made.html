            <main class="texte-projet">
                <p>
                    Mon projet, <strong>« Sans un mot »</strong>, explorait la poésie du geste silencieux, notamment à travers le vélo. <br>
                    <br> 
                    L’objectif était de faire découvrir à des non-cyclistes les sensations de ce sport, en mettant en avant la nature, le bruit et le bien-être qu’il procure. <br>
                    <br>
                    Destiné aux cyclistes amateurs et aux curieux. <br>
                    Le projet utilisait le tissu comme narrateur silencieux, porté et déplacé par le corps. <br>
                    <br>
                    Trois résultats clés : <br>
                    • un site web HTML pour partager les poèmes et la philosophie du projet <br>
                    • Trois typographies<br>
                    • Des flocages sur textiles et équipements (vélo, bidons),<br>
                    • Une installation immersive. <br>
                    <br>
                    Le silence, espace partagé et forme de connexion a montré que le design peut raconter une histoire autrement qu’avec des images : <br>
                    par le mouvement, le silence et les mots portés par le corps.<br>
                    <br>
                    <strong>Nous devenons tous des poètes cyclistes en portant cette philosophie.</strong> <br>
                </p>
            </main>
